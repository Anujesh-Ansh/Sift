name: project_sift
description: "AI-powered screenshot intelligence and organization system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.26.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Design
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase Suite
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7

  # Multimodal AI
  google_generative_ai: ^0.4.6

  # Media Discovery & Local Processing
  photo_manager: ^3.6.4
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  intl: ^0.20.2

  # Background Processing
  workmanager: ^0.10.9

  # UI & Responsive Layouts
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
